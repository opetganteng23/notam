# NOTAM: file statis UI + proxy /api ke backend di PC on-prem (lewat tunnel balik SSH di 127.0.0.1:13300).
# Hanya mendengarkan di gateway jaringan Docker; HTTPS dan domain ditangani Caddy
# (notam.ailabs.or.id -> reverse_proxy 172.19.0.1:13301), sama seperti situs lain di server ini.
limit_req_zone $http_x_forwarded_for zone=notam_login:10m rate=10r/m;

server {
    listen 172.19.0.1:13301;
    server_name _;

    root /var/www/notam;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /api/auth/login {
        limit_req zone=notam_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_next_upstream off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:13300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_connect_timeout 5s;     # PC mati / tunnel putus -> 502 cepat; UI menampilkan pesan "server on-prem tidak dapat dihubungi"
        proxy_read_timeout 220s;      # generate LLM bisa puluhan detik
        proxy_send_timeout 60s;
        proxy_next_upstream off;      # jangan ulang POST generate
    }

    # add_header di dalam location menimpa yang diwarisi dari server, jadi header keamanan diulang di sini.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    location / {
        try_files $uri /index.html;
    }
}
